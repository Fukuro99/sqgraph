[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqgraph"
version = "0.2.0"
description = "Embedded property graph database on SQLite + sqlite-vec with an openCypher subset, for GraphRAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["sqlite-vec>=0.1.6", "lark>=1.0"]

[project.scripts]
sqgraph-memory = "sqgraph.memory.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
memory = ["openai>=1.58"]
mcp = ["mcp>=1.21.1,<3", "openai>=1.58"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sqgraph.cypher" = ["grammar.lark"]
"sqgraph.viewer" = ["static/*.html"]
"sqgraph.memory" = ["skill/*.md", "opencode/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
